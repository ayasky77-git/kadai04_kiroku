<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiroku</title>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans+JP" rel="stylesheet" />
    <link rel="stylesheet" href="./css/kiroku.css">
</head>
<body>
    <header>
        <div popover="auto" id="menu_list"> 
            <div class="midashi_menu">
                <img src="./images/Vector.png" alt="tool">
                <h3>せってい</h3>
            </div>
            <div class="midashi_menu">
                <img src="./images/trash-2.png" alt="clear">
                <h3>きろくを消す</h3>
            </div>            
        </div>

        <input type="image" src="./images/menu.png" alt="menu" id="menu" popovertarget="menu_list" /> 
        <input type="image" src="./images/x.png" alt="close" id="close" popovertarget="menu_list" />

    </header>
    <div class="main">
        <section>
            <div class="midashi" id="settei">
                <img src="./images/Vector.png" alt="tool">
                <h3>せってい</h3>
            </div>
        </section>

        <section>
            <div class="midashi">
                <img src="./images/pen-tool.png" alt="theme">
                <h3>テーマ</h3>
            </div>
            <input type="text" id="theme" placeholder="テーマを入力">
            <button id="theme_save">保存する</button>
        </section>

        <section>
            <div class="midashi">
                <img src="./images/tag.png" alt="label">
                <h3>ラベルの追加（５つまで）</h3>
            </div>
            <div class="label_all">
                <!-- <div class="label">
                    <p class="label_name">こうぎ</p>
                    <p class="batu">×</p>
                </div>

                <div class="label">
                    <p class="label_name">かだい</p>
                    <p class="batu">×</p>
                </div>

                <div class="label">
                    <p class="label_name">どうが</p>
                    <p class="batu">×</p>
                </div>

                <div class="label">
                    <p class="label_name">ちょうさ</p>
                    <p class="batu">×</p>
                </div>

                <div class="label">
                    <p class="label_name">じしゅれん</p>
                    <p class="batu">×</p>
                </div> -->
            </div>
            <input type="text" id="label" placeholder="ラベル名を入力">
            <button id="label_add">追加する</button>

            <p id="clear">すべてをリセット</p>
        </section>

    </div>
    <footer> © 2025 r7 Corporation All Rights Reserved.</footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <script>
        // 追加するラベルの上限数
        const label_max=5;
        let label_num=0;
        let label_name=[];


        // テーマを保存する処理
        $('#theme_save').on('click',function(){
            let theme = $('#theme').val();
            localStorage.setItem('theme',theme);
        });

        // ラベルを追加する処理
        $('#label_add').on('click',function(){
            $('.label_all').append('<div class="label"> <p class="label_name">'+$('#label').val()+'</p> <p class="batu">×</p> </div>');
            label_name[label_num]=$('#label').val();
            console.log(label_name);
            label_num+=1;

            // localStorgeを上書き
            localStorage.setItem('label_num',label_num);
            localStorage.setItem('label_all',label_name);

            // 入力欄リセット
            $('#label').val('');

            // ラベル数が規定を超えたら追加できなくする
            if(label_num==label_max){
                $('#label_add').prop('disabled',true);
            }
        });

        // ×ボタンでラベルを消す処理
        $('.label_all').on('click','.batu',function(){
            // クリックされた .batu 要素から最も近い親要素 .label を見つける
            let $label_to_remove = $(this).closest(".label");
            // その .label 要素をDOMから削除する
            $label_to_remove.remove();

            // 配列から指定の文字列を消す処理から
            // console.log($label_to_remove);
            // label_name.filter(function(item) {
            // return item == $label_to_remove;
            // });

            // 消したらラベルの数を減らして、規定より少ないならボタンを活性化する
            label_num-=1;
            if(label_num<label_max){
            $('#label_add').prop('disabled',false);
            }

            // localStorgeを上書き
            localStorage.setItem('label_num',label_num);
            localStorage.setItem('label_all',label_name);
        });


        // storegeを読み出す処理

        // Storegeを消す処理
        
    </script>
    
</body>
</html>
