<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiroku</title>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans+JP" rel="stylesheet" />
    <link rel="stylesheet" href="./css/kiroku.css">
</head>
<body>
    <header>
        <img src="./images/menu.png" alt="menu">
    </header>
    <div class="main">
        <section>
            <div class="midashi" id="settei">
                <img src="./images/Vector.png" alt="tool">
                <h3>せってい</h3>
            </div>
        </section>

        <section>
            <div class="midashi">
                <img src="./images/pen-tool.png" alt="theme">
                <h3>テーマ</h3>
            </div>
            <input type="text" id="theme" placeholder=" テーマを入力">
            <button id="theme_save">保存する</button>
        </section>

        <section>
            <div class="midashi">
                <img src="./images/tag.png" alt="label">
                <h3>ラベルの追加（５つまで）</h3>
            </div>
            <div class="label_all">
                tag表示
            </div>
            <input type="text" id="label" placeholder=" ラベル名を入力">
            <button id="label_add">追加する</button>
        </section>

    </div>
    <footer>footer</footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <script>

    </script>
    
</body>
</html>
