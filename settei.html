<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiroku</title>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans+JP" rel="stylesheet" />
    <link rel="stylesheet" href="./css/kiroku.css">
</head>
<body>
    <header>
        <div popover="auto" id="menu_list"> 
            <div class="midashi_menu" id="menu_settei">
                <img src="./images/Vector.png" alt="tool">
                <h3>せってい</h3>
            </div>         
        </div>

        <input type="image" src="./images/menu.png" alt="menu" id="menu" popovertarget="menu_list" /> 
        <input type="image" src="./images/x.png" alt="close" id="close" popovertarget="menu_list" />

    </header>

    <div class="main">
        <section>
            <div class="midashi" id="settei">
                <img src="./images/Vector.png" alt="tool">
                <h3>せってい</h3>
            </div>
        </section>

        <section>
            <div class="midashi">
                <img src="./images/pen-tool.png" alt="theme">
                <h3>テーマ</h3>
            </div>
            <input type="text" id="theme" placeholder="テーマを入力">
            <button id="theme_save">保存する</button>
        </section>

        <section>
            <div class="midashi">
                <img src="./images/tag.png" alt="label">
                <h3>ラベルの追加（５つまで）</h3>
            </div>
            <div class="label_all">
                <!-- ラベル名が追加されたら表示 -->
            </div>
            <input type="text" id="label" placeholder="ラベル名を入力">
            <button id="label_add">追加する</button>

            <div class="midashi_menu" id="clear">
                <img src="./images/trash-2.png" alt="clear">
                <h3>きろくを消す</h3>
            </div>   
        </section>

    </div>
    <footer> © 2025 r7 Corporation All Rights Reserved.</footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <script>        
        // 追加するラベルの上限数
        const label_max=5;
        // ラベルをカウントする変数
        let label_num=0;
        // ラベル名を補完する配列
        let label_name=[];
        // すでに使用中の色を管理するための配列
        let used_colors = [];

        // ラベル用の5つのカラーコードを定義
        const label_colors = [
        '#406199',
        '#F2BF8C',
        '#CE5345',
        '#6AA94E',
        '#74492B' 
        ];


        // テーマを保存する処理
        $('#theme_save').on('click',function(){
            let theme = $('#theme').val();
            localStorage.setItem('theme',theme);
        });

        // ラベルを追加する処理
        $('#label_add').on('click',function(){

            // まだ使われていない色を探す
            let selected_color = '';
            for (let i = 0; i < label_colors.length; i++) {
                if (!used_colors.includes(label_colors[i])) {
                    selected_color = label_colors[i];
                    break;
                }
            }

            // 使用中リストとラベル情報に追加
            used_colors.push(selected_color);

            // ラベル情報をオブジェクトとして作成
            let new_label = {
                name: $('#label').val(),
                color: selected_color
            };

            // label_name (オブジェクトの配列) に追加
            label_name.push(new_label); 
            label_num += 1; // ラベル数の更新

            // ラベルの追加
            $('.label_all').append('<div class="label" style="background-color: ' + new_label.color + ';">' + '<p class="label_name">' + new_label.name + '</p>' + '<p class="batu">×</p>' + '</div>');

            // localStorgeを上書き
            localStorage.setItem('label_num',label_num);
            localStorage.setItem('label_name', JSON.stringify(label_name));  
            localStorage.setItem('used_colors', JSON.stringify(used_colors));

            // 入力欄リセット
            $('#label').val('');

            // ラベル数が規定を超えたら追加できなくする
            if(label_num==label_max){
                $('#label_add').prop('disabled',true);
            }
        });

        // ×ボタンでラベルを消す処理
        $('.label_all').on('click','.batu',function(){
            // クリックされた .batu 要素から最も近い親要素 .label を見つける
            let $label_to_remove = $(this).closest(".label");
            // 削除対象のlabel名を取得する
            let label_text_to_remove = $label_to_remove.find(".label_name").text();
            // 削除対象のlabelのカラーを取得する
            let color_to_release = $label_to_remove.css('background-color');
            
            // 削除対象のインデックスを label_name 配列（オブジェクトの配列）から探す
            let index = label_name.findIndex(item => item.name === label_text_to_remove);

            // used_colors から色を解放する
            if (index > -1) {
                // 解放する色を取得
                let color_to_release = label_name[index].color;
                
                // label_name 配列からオブジェクトを削除
                label_name.splice(index, 1);
                
                // used_colors から色を削除
                let color_index = used_colors.indexOf(color_to_release);
                if (color_index > -1) {
                    used_colors.splice(color_index, 1);
                }
            }

            // その .label 要素をDOMから削除する
            $label_to_remove.remove();
  
            // 消したらラベルの数を減らして、規定より少ないならボタンを活性化する
            label_num-=1;
            if(label_num<label_max){
            $('#label_add').prop('disabled',false);
            }
            
            // localStorgeを上書き
            localStorage.setItem('label_num',label_num);
            localStorage.setItem('label_name', JSON.stringify(label_name));        
            localStorage.setItem('used_colors', JSON.stringify(used_colors));
        });

                // Storegeを確認画面を出して、「すべて消すなら」すべて消す処理
        $('#clear').on('click',function () {  
            let checkSaveFlg = window.confirm('登録したテーマ、ラベル、きろく、すべてをリセットしますか？');
            if(checkSaveFlg) {
                alert("すべてリセットしました");
                // Storegeリセット
                localStorage.clear();
                // 入力欄リセット
                $('#theme').val('');
                $('#label').val('');
                // ラベルリセット
                $('.label_all').html('');
                // 各種値リセット
                label_num=0;
                label_name=[];
                used_colors = [];
                // ボタン非活性リセット
                $('#label_add').prop('disabled',false);
            } 
        });

        // storegeからthemeを読み出す処理
        if(localStorage.getItem('theme')){
            const theme_save_data=localStorage.getItem('theme');
            $('#theme').val(theme_save_data);
        }

        // storegeからlabel_numを読み出す処理
        if(localStorage.getItem('label_num')){
            // 数値として呼び出すためintを使用
            label_num = parseInt(localStorage.getItem('label_num'));

            // ラベル数が規定を超えたら追加できなくする
            if(label_num==label_max){
                $('#label_add').prop('disabled',true);
            }
        }

        // ラベル配列（label_name）の読み出し
        if(localStorage.getItem('label_name')){
            label_name = JSON.parse(localStorage.getItem('label_name'));
            label_num = label_name.length; // 配列の長さからlabel_numを再設定
            
            // 画面にラベル要素を再構築する
            for(let i = 0; i < label_name.length; i++){
                $('.label_all').append('<div class="label" style="background-color: ' + label_name[i].color + ';">' + '<p class="label_name">' + label_name[i].name + '</p>' + '<p class="batu">×</p>' + '</div>');
            }
        }
        
        // used_colors の読み出し
        if(localStorage.getItem('used_colors')){
            used_colors = JSON.parse(localStorage.getItem('used_colors'));
        }


        // menuの設定ボタンを押すと設定へとぶ
        $('#menu_settei').on('click',function(){
            window.location.href = 'settei.html'; 
        });
        

    </script>
    
</body>
</html>
