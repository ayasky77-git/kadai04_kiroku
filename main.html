<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiroku</title>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans+JP" rel="stylesheet" />
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="./css/kiroku.css">
</head>
<body>
    <header>
        <div id="title"></div>
        <div popover="auto" id="menu_list"> 
            <div class="midashi_menu" id="next1">
                <img src="./images/next.png" alt="next">
                <h3>きろく画面へ</h3>
            </div> 

            <div class="midashi_menu" id="menu_settei">
                <img src="./images/Vector.png" alt="tool">
                <h3>せってい</h3>
            </div>         
        </div>

        <input type="image" src="./images/menu.png" alt="menu" id="menu" popovertarget="menu_list" /> 
        <input type="image" src="./images/x.png" alt="close" id="close" popovertarget="menu_list" />

    </header>
    <div class="main">
        <div id="tabs">
            <ul>
                <li><a href="#kiroku">
                    <div class="midashi" id="settei">
                    <img src="./images/edit.png" alt="edit">
                    <h3>きろく</h3>
                    </div>
                </a></li>
                <li><a href="#graph">
                    <div class="midashi" id="settei">
                    <img src="./images/activity.png" alt="graph">
                    <h3>グラフ</h3>
                    </div>
                </a></li>
            </ul>

            <div id="kiroku">
                <section>
                    <div id="date">
                    </div>
                    <div id="timer">
                        <p id="timertext"></p>
                    </div>                    
                    <div class="panel_group">
                        <div id="panel">
                            <img src="./images/start.png" alt="start" class="panel_button" id="start">
                            <img src="./images/stop.png" alt="stop" class="panel_button" id="stop">
                        </div>
                        <p id="reset">リセット</p>
                    </div>
                </section>
                <section>
                    <select name="label_option" id="label_option">
                        <option value="" disabled selected>--選択してください--</option>
                    </select>

                    <input type="text" id="memo" placeholder="メモを入力">
                    <button id="memo_save">保存する</button>
                </section>
            </div>

            <div id="graph">
                <div id="average_time_display"></div>
                <div id="graph-wrapper">
                    <div id="chart-container">
                        <canvas id="myChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <footer> © 2025 r7 Corporation All Rights Reserved.</footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Local Storage関連
        let label_num = 0;
        let label_name = [];

        // タイマー関連
        let startTime = 0;      // 直前の計測セグメントの開始時刻 (timestamp)
        let elapsedTime = 0;    // 停止までに蓄積された合計経過時間 (ms)
        let timerID = null;     // タイマーIDを保持
        let $timertext;         // jQueryオブジェクトを保持

        //Local Storageを読み込み
        // storegeからthemeを読み出す処理
        if(localStorage.getItem('theme')){
            const theme_save_data=localStorage.getItem('theme');
            $('#title').append('<p>' + theme_save_data + 'きろく</p>');
            console.log(theme_save_data);
        }

        // storegeからlabel_numを読み出す処理
        if(localStorage.getItem('label_num')){
            // 数値として呼び出すためintを使用
            label_num = parseInt(localStorage.getItem('label_num'));
        }

        // ラベル配列（label_name）の読み出し
        if(localStorage.getItem('label_name')){
            const stored_labels_json = localStorage.getItem('label_name');
            // ★JSON.parse()で文字列を配列に戻す
            label_name = JSON.parse(stored_labels_json);
            for(let i=0;i<label_name.length;i++){
                $("#label_option").append('<option value='+label_name[i].name+'>'+label_name[i].name+'</option>');
            }
        }

        // 日付を取得&表示
        const days = ["日", "月", "火", "水", "木", "金", "土"];
        let today = new Date();
        let year = today.getFullYear();
        let month = today.getMonth()+ 1;
        let date = today.getDate();
        let dayOfWeek = today.getDay(); // 曜日
        let date_time=(year + '年' + month + '月' + date + '日 (' + days[dayOfWeek] + ')');
        $('#date').append('<h3 id=today>'+date_time+'</h3>');
        
        // 「きろく画面へ」ボタンを押す「きろく画面」へとぶ
        $('#next1').on('click',function(){
            window.location.href = 'main.html'; 
        });

        // menuの設定ボタンを押すと設定へとぶ
        $('#menu_settei').on('click',function(){
            window.location.href = 'settei.html'; 
        });

        // タイマー機能
        // ミリ秒を経過時間の文字列に直す関数
        function msecToSecString(time) {
            
            // 単位をミリ秒から秒へ変換
            let totalSeconds = Math.floor(time / 1000);
            // 秒数
            const seconds = totalSeconds % 60;            
            // 分数
            let totalMinutes = Math.floor(totalSeconds / 60);
            const minutes = totalMinutes % 60;

            // 時間
            const hours = Math.floor(totalMinutes / 60);

            // 取得した数値をも2桁の文字列になるように、必要に応じて0を補う
            const secondStr = (seconds < 10 ? '0' : '') + String(seconds);
            const minutesStr = (minutes < 10 ? '0' : '') + String(minutes);
            const hoursStr = (hours < 10 ? '0' : '') + String(hours);

            return hoursStr + ":" + minutesStr + ":" + secondStr;
        }

        // タイマーの時刻を更新する処理
        function UpdateTimer() {
            const nowTime = new Date().getTime();
            // 合計時間 = 蓄積されていた時間 + 直前のスタート時からの経過時間
            const totalTime = elapsedTime + (nowTime - startTime);
            // jQueryオブジェクトの.text()メソッドを使って更新
            $timertext.text(msecToSecString(totalTime));
        }

        $(function() {
            $timertext = $("#timertext");
            // タイマーの初期表示
            $timertext.text('00:00:00');
        });

        // スタートボタン処理
        $('#start').on('click',function(){
            // タイマーが動いていたら何もしない
            if (timerID !== null) return; 

            // 現在の時刻を、今回の計測セグメントのスタート時刻として記録
            startTime = new Date().getTime();
        
            // タイマーを開始し、IDを保存
            timerID = setInterval(UpdateTimer, 1000);
        });
        
        // 停止処理
        $('#stop').on('click', function(){
            // タイマーが停止していたら何もしない
            if (timerID === null) return;

            clearInterval(timerID); // タイマーを停止
            timerID = null;         // IDをクリア

            // 直前のセグメントでの経過時間を計算し、合計経過時間(elapsedTime)に加算して保存
            elapsedTime += new Date().getTime() - startTime; 
        
            // 停止した時点での正確な時間を表示に反映（UpdateTimerが最後に実行された結果を確定）
            $timertext.text(msecToSecString(elapsedTime));
        });

        // リセット処理
        $('#reset').on('click', function(){
            clearInterval(timerID); // 動作中なら停止
            timerID = null;
            elapsedTime = 0;        // 蓄積時間をリセット
            startTime = 0;          // 開始時間をリセット
            $timertext.text('00:00:00'); // 表示をリセット
        });

        // label_name配列から、指定されたラベル名に対応する色を返す関数
        function getLabelColor(name) {
            // label_name配列を検索し、nameが一致するオブジェクトを見つける
            const labelObject = label_name.find(item => item.name === name);
            // オブジェクトが見つかったらその色を返し、見つからなかったらデフォルト値を返す
            return labelObject ? labelObject.color : '#CCCCCC';
        }
        

        // 保存処理
        $('#memo_save').on('click',function(){
            // 配列の定義、既存データの読み込み
            let records = JSON.parse(localStorage.getItem('daily_records') || '[]');
            
            // ラベルを選択してない時はアラートを出す
            const selectedLabel = $('#label_option').val();
            if (!selectedLabel) {
                alert('ラベルを選択してください。');
                return;
            }
            
            // レコードデータのオブジェクトの定義
            const new_records ={
                date:date_time,
                labelName:$('#label_option').val(),
                labelColor:getLabelColor($('#label_option').val()),
                durationMs:elapsedTime,
                memo:$('#memo').val(),
            } 

            // レコードデータの追加
            records.push(new_records);

            // JSONデータに変換
            const json_records=JSON.stringify(records);

            // localStorageに保存
            localStorage.setItem('daily_records',json_records);

            $('#reset').trigger('click');
            $('#memo').val('');
            alert('記録を保存しました！');

            // 平均時間の再計算
            displayOverallAverage();

        });

        // グラフ描画機能
        function drawChart() {
            // 既存のグラフインスタンスがあれば破棄（再描画のため）
            if (window.myChartInstance) {
                window.myChartInstance.destroy();
            }
            
            // Local Storageから全記録を読み込み
            let records = JSON.parse(localStorage.getItem('daily_records') || '[]');
            let labelsData = label_name; 

            if (records.length === 0) {
                console.log("記録データがありません。");
                return; 
            }

            // グラフラベル（日付）の準備とソート
            // ユニークな日付を取得
            const uniqueDateStrings = Array.from(new Set(records.map(r => r.date)));
            
            // 日付文字列を Date オブジェクトに変換し、ソート可能な形式にする
            const sortedDates = uniqueDateStrings
                .map(dateStr => {
                    // "YYYY年MM月DD日 (曜日)" の形式から、日付情報のみを抽出
                    const match = dateStr.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
                    
                    if (match && match.length === 4) {
                        // match[1]:年, match[2]:月, match[3]:日
                        // 月は0から始まるため match[2] - 1 が必要
                        const date = new Date(match[1], match[2] - 1, match[3]);
                        
                        // Dateオブジェクトが有効かチェック
                        if (isNaN(date.getTime())) {
                            console.error('無効な日付を検出 (パース失敗):', dateStr);
                            return null;
                        }
                        // Dateオブジェクトと元の文字列をペアで返す
                        return { originalStr: dateStr, dateObj: date };
                    }
                    console.error('日付フォーマットが一致しません:', dateStr);
                    return null;
                })
                .filter(item => item !== null) // 無効な日付をフィルタリング
                .sort((a, b) => a.dateObj.getTime() - b.dateObj.getTime()) // Dateオブジェクトでソート
                
                // 3. 元の表示形式 ("YYYY年MM月DD日 (曜日)") に戻す
                .map(item => item.originalStr); // ソートされた元の文字列の配列に戻す

            console.log('Sorted Dates (for Chart Labels):', sortedDates);


            // データセットの集計と整形
            let chartDatasets = [];
            
            // データをラベルごとに集計
            labelsData.forEach(labelItem => {
                let dataForLabel = [];

                // ソートされた日付を基準にデータを集計する
                sortedDates.forEach(date => {
                    const matchingRecords = records.filter(
                        // 記録の日付と集計対象の日付が一致し、かつラベル名が一致するものをフィルタ
                        r => r.date === date && r.labelName === labelItem.name
                    );

                    // ミリ秒を時間単位に合計 (3600000ms = 1h)
                    const totalHours = matchingRecords.reduce((sum, r) => sum + (r.durationMs / 3600000), 0);
            
                    dataForLabel.push(totalHours); 
                });

                // データセットとして追加（各ラベルが積み上げ要素となる）
                chartDatasets.push({
                    label: labelItem.name,
                    data: dataForLabel,
                    backgroundColor: labelItem.color,
                });
            });

            // グラフ描画
            let ctx = $("#myChart");
            
            // 棒グラフの高さの計算と適用
            const barHeight = 40; 
            // データポイント数に基づいて高さを動的に計算
            const requiredHeight = sortedDates.length * barHeight + 100; 
            ctx.css('height', `${requiredHeight}px`); 
            
            // Chart.js インスタンスをグローバル変数に保存
            window.myChartInstance = new Chart(ctx, { 
                type: 'bar',
                data: {
                    labels: sortedDates, 
                    datasets: chartDatasets, 
                },
                options: {
                    indexAxis: 'y', // 横棒グラフ（ラベルをY軸に表示）
                    responsive: true,
                    maintainAspectRatio: false, // 高さをCSSで制御できるようにする
                    scales: {
                        x: {
                            stacked: true,
                            title: {
                                display: true,
                                text: '時間 (時間)' 
                            },
                            // X軸の目盛りの表示を小数点第2位までに制限する
                            ticks: { 
                                callback: function(value, index, ticks) {
                                    if (value <= 0) return null; 
                                    return value.toFixed(2) + 'H';
                                }
                            },
                            min: 0, // 負の値を非表示にする
                        },
                        y: {
                            stacked: true,
                            // 棒の間隔を調整
                            barPercentage: 1.0, 
                            categoryPercentage: 0.9, 
                        }
                    }
                }
            });
        }


        // タブ表示と、グラフ描画関数の呼び出しの修正
        $(function() {
            $("#tabs").tabs({
                // タブがアクティブになったときに実行
                activate: function(event, ui) {
                    // 新しいタブが #graph であることを確認
                    if (ui.newTab.find('a').attr('href') === '#graph') {
                        drawChart(); 
                    }
                }
            });
            displayOverallAverage();

            // 初回ロード時、「グラフ」タブがアクティブな場合（画像の状態）は、明示的に描画関数を呼び出す
            if ($("#tabs").tabs("option", "active") === 1) { 
                drawChart();
            }
        });
        
        // 平均時間と合計時間を計算する関数
        function calculateOverallAverageTime() {
            const records = JSON.parse(localStorage.getItem('daily_records') || '[]');
            if (records.length === 0) {
                // 記録がない場合は、平均0と合計0をオブジェクトで返す
                return { averageMinutes: 0, totalDurationMs: 0 };
            }
            
            const totalDurationMs = records.reduce((sum, record) => {
                // durationMs が存在しない場合を考慮して、0をデフォルトにする
                return sum + (record.durationMs || 0); 
            }, 0);
            
            const totalMinutes = totalDurationMs / 60000;
            const averageMinutes = totalMinutes / records.length;
            
            // 平均と合計のミリ秒をオブジェクトとして返す
            return { 
                averageMinutes: averageMinutes, 
                totalDurationMs: totalDurationMs 
            };
        }

        // 全体の平均時間、合計時間を計算し、整形して表示する関数
        function displayOverallAverage() {
            // calculateOverallAverageTime がオブジェクトを返すように修正された
            const result = calculateOverallAverageTime(); 
            
            if (result.averageMinutes === 0) {
                $('#average_time_display').text('記録がありません');
                return;
            }

            // 平均時間 (分) からミリ秒と整形済み文字列を計算
            const averageMs = result.averageMinutes * 60000;
            const formattedAverageTime = msecToSecString(averageMs); 

            // 合計時間 (ミリ秒) を整形
            const totalMs = result.totalDurationMs;
            const formattedTotalTime = msecToSecString(totalMs); // 既存関数を使用

            $('#average_time_display').html(
                '<h3>平均: ' + formattedAverageTime + '</h3>' +
                '<h3>合計: ' + formattedTotalTime + '</h3>'
            );
        }
    </script>

    

</body>
</html>
