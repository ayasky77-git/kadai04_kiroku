<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiroku</title>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans+JP" rel="stylesheet" />
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="./css/kiroku.css">
</head>
<body>
    <header>
        <div id="title"></div>
        <div popover="auto" id="menu_list"> 
            <div class="midashi_menu" id="menu_settei">
                <img src="./images/Vector.png" alt="tool">
                <h3>せってい</h3>
            </div>         
        </div>

        <input type="image" src="./images/menu.png" alt="menu" id="menu" popovertarget="menu_list" /> 
        <input type="image" src="./images/x.png" alt="close" id="close" popovertarget="menu_list" />

    </header>
    <div class="main">
        <div id="tabs">
            <ul>
                <li><a href="#kiroku">
                    <div class="midashi" id="settei">
                    <img src="./images/edit.png" alt="edit">
                    <h3>きろく</h3>
                    </div>
                </a></li>
                <li><a href="#graph">
                    <div class="midashi" id="settei">
                    <img src="./images/activity.png" alt="graph">
                    <h3>グラフ</h3>
                    </div>
                </a></li>
            </ul>

            <div id="kiroku">
                <section>
                    <div id="date">
                    </div>
                    <div id="timer">
                        <p id="timertext"></p>
                    </div>                    
                    <div class="panel_group">
                        <div id="panel">
                            <img src="./images/start.png" alt="start" class="panel_button" id="start">
                            <img src="./images/stop.png" alt="stop" class="panel_button" id="stop">
                        </div>
                        <p id="reset">リセット</p>
                    </div>
                </section>
                <section>
                    <select name="label_option" id="label_option">
                        <option value="" disabled selected>--選択してください--</option>
                    </select>

                    <input type="text" id="memo" placeholder="メモを入力">
                    <button id="memo_save">保存する</button>
                </section>
            </div>

            <div id="graph">
                <canvas id="myChart"></canvas>

            </div>
        </div>

    </div>
    <footer> © 2025 r7 Corporation All Rights Reserved.</footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Local Storage関連
        let label_num = 0;
        let label_name = [];

        // タイマー関連
        let startTime = 0;      // 直前の計測セグメントの開始時刻 (timestamp)
        let elapsedTime = 0;    // 停止までに蓄積された合計経過時間 (ms)
        let timerID = null;     // タイマーIDを保持
        let $timertext;         // jQueryオブジェクトを保持

        // タブ表示
        $(function() {
            $("#tabs").tabs();
        });

        //Local Storageを読み込み
        // storegeからthemeを読み出す処理
        if(localStorage.getItem('theme')){
            const theme_save_data=localStorage.getItem('theme');
            $('#title').append('<p>' + theme_save_data + 'きろく</p>');
            console.log(theme_save_data);
        }

        // storegeからlabel_numを読み出す処理
        if(localStorage.getItem('label_num')){
            // 数値として呼び出すためintを使用
            label_num = parseInt(localStorage.getItem('label_num'));
        }

        // ラベル配列（label_name）の読み出し
        if(localStorage.getItem('label_name')){
            const stored_labels_json = localStorage.getItem('label_name');
            // ★JSON.parse()で文字列を配列に戻す
            label_name = JSON.parse(stored_labels_json);
            for(let i=0;i<label_name.length;i++){
                $("#label_option").append('<option value='+label_name[i].name+'>'+label_name[i].name+'</option>');
            }
        }

        // 日付を取得&表示
        const days = ["日", "月", "火", "水", "木", "金", "土"];
        let today = new Date();
        let year = today.getFullYear();
        let month = today.getMonth()+ 1;
        let date = today.getDate();
        let dayOfWeek = today.getDay(); // 曜日
        let date_time=(year + '年' + month + '月' + date + '日 (' + days[dayOfWeek] + ')');
        $('#date').append('<h3 id=today>'+date_time+'</h3>');
        
        // menuの設定ボタンを押すと設定へとぶ
        $('#menu_settei').on('click',function(){
            window.location.href = 'settei.html'; 
        });

        // タイマー機能
        // ミリ秒を経過時間の文字列に直す関数
        function msecToSecString(time) {
            
            // 単位をミリ秒から秒へ変換
            let totalSeconds = Math.floor(time / 1000);
            // 秒数
            const seconds = totalSeconds % 60;            
            // 分数
            let totalMinutes = Math.floor(totalSeconds / 60);
            const minutes = totalMinutes % 60;

            // 時間
            const hours = Math.floor(totalMinutes / 60);

            // 取得した数値をも2桁の文字列になるように、必要に応じて0を補う
            const secondStr = (seconds < 10 ? '0' : '') + String(seconds);
            const minutesStr = (minutes < 10 ? '0' : '') + String(minutes);
            const hoursStr = (hours < 10 ? '0' : '') + String(hours);

            return hoursStr + ":" + minutesStr + ":" + secondStr;
        }

        // タイマーの時刻を更新する処理
        function UpdateTimer() {
            const nowTime = new Date().getTime();
            // 合計時間 = 蓄積されていた時間 + 直前のスタート時からの経過時間
            const totalTime = elapsedTime + (nowTime - startTime);
            // jQueryオブジェクトの.text()メソッドを使って更新
            $timertext.text(msecToSecString(totalTime));
        }

        $(function() {
            $timertext = $("#timertext");
            // タイマーの初期表示
            $timertext.text('00:00:00');
        });

        // スタートボタン処理
        $('#start').on('click',function(){
            // タイマーが動いていたら何もしない
            if (timerID !== null) return; 

            // 現在の時刻を、今回の計測セグメントのスタート時刻として記録
            startTime = new Date().getTime();
        
            // タイマーを開始し、IDを保存
            timerID = setInterval(UpdateTimer, 1000);
        });
        
        // 停止処理
        $('#stop').on('click', function(){
            // タイマーが停止していたら何もしない
            if (timerID === null) return;

            clearInterval(timerID); // タイマーを停止
            timerID = null;         // IDをクリア

            // 直前のセグメントでの経過時間を計算し、合計経過時間(elapsedTime)に加算して保存
            elapsedTime += new Date().getTime() - startTime; 
        
            // 停止した時点での正確な時間を表示に反映（UpdateTimerが最後に実行された結果を確定）
            $timertext.text(msecToSecString(elapsedTime));
        });

        // リセット処理
        $('#reset').on('click', function(){
            clearInterval(timerID); // 動作中なら停止
            timerID = null;
            elapsedTime = 0;        // 蓄積時間をリセット
            startTime = 0;          // 開始時間をリセット
            $timertext.text('00:00:00'); // 表示をリセット
        });

        // グラフ表示
        // 明日はjson形式のところから
        $(function() {
			let ctx = $("#myChart");
            let chartLabels = label_name.map(item => item.name);
            console.log(label_name);
			let myChart = new Chart(ctx, {
				type: 'bar',
				data: {
					labels: chartLabels,
					datasets: [{
						label: 'Male',
						data: [8, 5, 3],
						backgroundColor: "rgba(65,105,225,0.4)"
						}, {
						label: 'Female',
						data: [2, 10, 8],
						backgroundColor: "rgba(255,105,180,0.4)"
					}]
				},
                options: {
                    // グラフを縦にする
                    indexAxis: 'y',
                    scales: {
                        x:{
                            // X軸の棒を積み上げる
                            stacked: true
                        },
                        y:{
                            // Y軸の値を積み上げる
                            stacked: true 
                        }
                    }
                }
			});
		});

    </script>

</body>
</html>
