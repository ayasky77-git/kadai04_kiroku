<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiroku</title>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans+JP" rel="stylesheet" />
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="./css/kiroku.css">
</head>
<body>
    <header>
        <div id="title"></div>
        <div popover="auto" id="menu_list"> 
            <div class="midashi_menu" id="menu_settei">
                <img src="./images/Vector.png" alt="tool">
                <h3>せってい</h3>
            </div>         
        </div>

        <input type="image" src="./images/menu.png" alt="menu" id="menu" popovertarget="menu_list" /> 
        <input type="image" src="./images/x.png" alt="close" id="close" popovertarget="menu_list" />

    </header>
    <div class="main">
        <div id="tabs">
            <ul>
                <li><a href="#kiroku">
                    <div class="midashi" id="settei">
                    <img src="./images/edit.png" alt="edit">
                    <h3>きろく</h3>
                    </div>
                </a></li>
                <li><a href="#graph">
                    <div class="midashi" id="settei">
                    <img src="./images/activity.png" alt="graph">
                    <h3>グラフ</h3>
                    </div>
                </a></li>
            </ul>

            <div id="kiroku">
                <section id="date">
                </section>
                <section>
                    10:00:00
                    <!-- 明日は時間から、menulistが崩れる権は別途調査 -->
                </section>
                <section class="panel_group">
                    <div id="panel">
                        <img src="./images/start.png" alt="start" class="panel_button">
                        <img src="./images/stop.png" alt="stop" class="panel_button">
                    </div>
                    <p id="reset">リセット</p>
                </section>
                <section>
                    <select name="label_option" id="label_option">
                        <option value="" disabled selected>--選択してください--</option>
                    </select>

                    <input type="text" id="memo" placeholder="メモを入力">
                    <button id="memo_save">保存する</button>
                </section>
            </div>

            <div id="graph">
                グラフタブ
            </div>
        </div>

    </div>
    <footer> © 2025 r7 Corporation All Rights Reserved.</footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

    <!-- タブ部分 -->
    <script>
        $(function() {
        $("#tabs").tabs();
        });
    </script>
    
    <!--  Local Storageを読み込み  -->
    <script>
        // ラベルをカウントする変数
        let label_num=0;
        // ラベル名を補完する配列
        let label_name=[];

        // storegeからthemeを読み出す処理
        if(localStorage.getItem('theme')){
            const theme_save_data=localStorage.getItem('theme');
            $('#title').append('<p>' + theme_save_data + 'きろく</p>');
            console.log(theme_save_data);
        }

        // storegeからlabel_numを読み出す処理
        if(localStorage.getItem('label_num')){
            // 数値として呼び出すためintを使用
            label_num = parseInt(localStorage.getItem('label_num'));
        }

        // ラベル配列（label_name）の読み出し
        if(localStorage.getItem('label_name')){
            const stored_labels_json = localStorage.getItem('label_name');
            // ★JSON.parse()で文字列を配列に戻す
            label_name = JSON.parse(stored_labels_json);
            for(let i=0;i<label_name.length;i++){
                $("#label_option").append('<option value='+label_name[i].name+'>'+label_name[i].name+'</option>');
            }
        }
    </script>

    <script>
        // 日付を取得&表示
        const days = ["日", "月", "火", "水", "木", "金", "土"];
        let today = new Date();
        let year = today.getFullYear();
        let month = today.getMonth()+ 1;
        let date = today.getDate();
        let dayOfWeek = today.getDay(); // 曜日
        let date_time=(year + '年' + month + '月' + date + '日 (' + days[dayOfWeek] + ')');
        $('#date').append('<h3 id=today>'+date_time+'</h3>');
        

        // menuの設定ボタンを押すと設定へとぶ
        $('#menu_settei').on('click',function(){
            window.location.href = 'settei.html'; 
        });
        

    </script>
    
</body>
</html>
